# Spring Boot runs inside Docker Compose: compose.full.yaml sets SPRING_PROFILES_ACTIVE=docker.
# Spring Boot reads application.properties first, then this file, and the values
# here win. Only what is different inside Docker belongs here.

# "db" is the Compose service name. localhost would be the api container itself.
spring.datasource.url=jdbc:mysql://db:3306/coffeeshop

# Less noise in the container log
spring.jpa.show-sql=false

# Docker Model Runner, seen from inside a container (Docker Desktop).
# On Docker Engine for Linux, use http://172.17.0.1:12434/engines/v1 instead.
spring.ai.openai.base-url=http://model-runner.docker.internal/engines/v1
