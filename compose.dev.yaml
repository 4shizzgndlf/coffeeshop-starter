# Development: Docker runs MySQL, Nginx and Caddy, Spring Boot runs in your IDE.
#
#   docker compose -f compose.dev.yaml up -d
#
# Then start CoffeeShopApplication in your IDE and open http://localhost:8088.
# Ports are bound to 127.0.0.1, so only your own machine can reach them.
# The passwords come from the .env file next to this file (see .env.example).

# Same project name as compose.full.yaml, so both use the same database volume
name: coffeeshop

services:

  db:
    image: mysql:8.4
    # Start again after a crash or a reboot - but not after "docker compose stop"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: coffeeshop
      MYSQL_USER: ${DB_USERNAME:-coffeeshop}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      # Spring Boot in your IDE connects to localhost:3306
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # "healthy" once MySQL answers. Uses TCP (127.0.0.1), not the local socket:
      # on first start MySQL runs a temporary socket-only server while it sets up,
      # which must not count as healthy.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    # Plain Nginx, serving the files straight from your working copy:
    # edit frontend/src, save, reload the browser - no image to build.
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    # The reverse proxy: the only service the browser talks to (see Caddyfile)
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      # http://localhost:8088
      - "127.0.0.1:8088:80"
    environment:
      # Send /api/ to Spring Boot in your IDE, on port 8080 of your machine
      API_UPSTREAM: host.docker.internal:8080
    extra_hosts:
      # Makes host.docker.internal mean "my machine" on Linux too
      # (Docker Desktop on Mac and Windows already knows it)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy keeps its state here (certificates, once we use HTTPS)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  # The database files. Survives "docker compose down" - only "down -v" deletes it.
  mysql_data:
  caddy_data:
  caddy_config:
