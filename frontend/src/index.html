<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Shop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Absolute paths (/style.css, not style.css): a deep link like /products/3
       would otherwise look for /products/style.css -->
  <link href="/style.css" rel="stylesheet">

  <!-- Maps bare imports like `import Navigo from "navigo"` to files -->
  <script type="importmap">
    {
      "imports": {
        "navigo": "/js/vendor/navigo.js"
      }
    }
  </script>
</head>

<body>
  <header>
    <a class="brand" href="/" data-navigo>
      <img class="brand__logo" src="/favicon.svg" alt="" width="28" height="28">
      Coffee Shop
    </a>
    <nav>
      <a href="/" data-navigo>Shop</a>
      <a href="/orders" data-navigo>My orders</a>
      <a href="/profile" data-navigo>Profile</a>
      <!-- app.js adds the item count (CartBadge) to this link -->
      <a id="cart-link" href="/cart" data-navigo>Cart</a>
    </nav>
  </header>

  <main id="app"></main>

  <footer>
    <p>Coffee Shop &copy; 2026 &middot; A teaching project, no real coffee is sold</p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>

</html>
