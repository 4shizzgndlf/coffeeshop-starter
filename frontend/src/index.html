<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Shop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Absolute paths (/style.css, not style.css): a deep link like /products/3
       would otherwise look for /products/style.css -->
  <link href="/style.css" rel="stylesheet">

  <!-- Maps bare imports like `import Navigo from "navigo"` to files -->
  <script type="importmap">
    {
      "imports": {
        "navigo": "/vendor/navigo.js"
      }
    }
  </script>
</head>

<body>
  <header>
    <a class="brand" href="/" data-navigo>
      <img class="brand__logo" src="/favicon.svg" alt="" width="28" height="28">
      Coffee Shop
    </a>
    <nav>
      <a href="/" data-navigo>Shop</a>
      <a href="/assistant" data-navigo>Assistant</a>
      <a href="/orders" data-navigo>My orders</a>
      <a href="/profile" data-navigo>Profile</a>
      <!-- Shown to staff only, by initUserMenu() (components/UserMenu.js) -->
      <a id="staff-link" href="/staff" data-navigo hidden>Staff</a>
      <!-- initCartBadge() (components/CartBadge.js) shows the item count here -->
      <a id="cart-link" href="/cart" data-navigo>Cart<span class="cart-badge" hidden></span></a>
      <!-- "Log in", or the user's email and "Log out" (components/UserMenu.js) -->
      <span id="user-menu" class="user-menu"></span>
    </nav>
  </header>

  <main id="app"></main>

  <footer>
    <p>Coffee Shop &copy; 2026 &middot; A teaching project, no real coffee is sold</p>
  </footer>

  <script type="module" src="/app.js"></script>
</body>

</html>
