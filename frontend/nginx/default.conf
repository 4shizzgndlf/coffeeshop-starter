# Nginx config for the Coffee Shop frontend image.
#
# Nginx only serves the files in frontend/src. It knows nothing about the API:
# Caddy (see the Caddyfile) sits in front and sends /api/ to Spring Boot.

server {
    listen 80;
    server_name _;

    server_tokens off;

    # The Dockerfile copies frontend/src here
    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A quick "is Nginx alive?" check, used by Docker's health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Files with an extension must really exist - a missing script gives a 404,
    # not index.html. "no-cache" means the browser re-checks the file on every load,
    # so a changed file is picked up right away (it is still cached when unchanged).
    location ~* \.(?:js|mjs|css|json|map|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app fallback: there is no file called /products/42, so Nginx
    # answers with index.html, and the JavaScript router decides what to show.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
