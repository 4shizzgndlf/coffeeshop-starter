# The APP VM of the two-VM setup: Spring Boot, Nginx and Caddy.
# MySQL runs on the database VM and is reached on its private IP (DB_HOST).
# Guide: docs/02-azure-two-vms.md
#
# Nothing is built here. The images come from GitHub Container Registry (GHCR),
# where .github/workflows/release.yml publishes them for every version tag.
# The settings come from the .env file next to this file (see .env.example).
#
#   docker compose pull      download the images for APP_VERSION
#   docker compose up -d     start everything, or switch to a new APP_VERSION

name: coffeeshop

services:

  api:
    # e.g. ghcr.io/your-user/coffeeshop-api:1.0.0
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}-api:${APP_VERSION:?Set APP_VERSION in .env}
    # Also restarts it while the database VM isn't reachable yet
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Replaces spring.datasource.url from application-docker.properties (jdbc:mysql://db:3306/...):
      # there is no "db" container on this VM, the database is on the other VM.
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:?Set DB_HOST in .env}:3306/coffeeshop
      DB_USERNAME: ${DB_USERNAME:-coffeeshop}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    # e.g. ghcr.io/your-user/coffeeshop-frontend:1.0.0
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}-frontend:${APP_VERSION:?Set APP_VERSION in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      # The only published ports. Azure's network security group decides who
      # may reach them (80 and 443 from anywhere).
      - "80:80"
      - "443:443"
    environment:
      API_UPSTREAM: api:8080
      # ":80" for plain HTTP, or the VM's DNS name for HTTPS (see the Caddyfile)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  # Caddy's HTTPS certificates. Keep it: Let's Encrypt limits how often you may ask for new ones.
  caddy_data:
  caddy_config:
