# The DATABASE VM of the two-VM setup: only MySQL.
# Guide: docs/02-azure-two-vms.md
#
# The settings come from the .env file next to this file (see .env.example).
#
#   docker compose up -d

name: coffeeshop-db

services:

  db:
    image: mysql:8.4
    # Start again after a crash or a reboot of the VM
    restart: unless-stopped
    ports:
      # Published on the VM's network card, so the app VM can connect to
      # <private IP>:3306. This VM has no public IP, and its network security
      # group only lets the app subnet in on this port.
      - "3306:3306"
    environment:
      MYSQL_DATABASE: coffeeshop
      MYSQL_USER: ${DB_USERNAME:-coffeeshop}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  # The database. Survives "docker compose down" - only "down -v" deletes it.
  mysql_data:
